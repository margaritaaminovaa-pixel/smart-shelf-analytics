[mypy]
# 3.12 rather than the 3.11 runtime floor: numpy >= 2.5 ships stubs written with
# PEP 695 `type` statements, which mypy refuses to parse under 3.11 semantics.
# The package itself uses no 3.12-only syntax; the 3.11 runtime is verified by the
# CI test matrix rather than by the type checker.
python_version = 3.12
mypy_path = src
packages = smart_shelf
namespace_packages = True
explicit_package_bases = True

strict = True
warn_unreachable = True
warn_no_return = True
warn_redundant_casts = True
warn_unused_ignores = True
disallow_any_generics = True
disallow_untyped_defs = True
no_implicit_reexport = False
show_error_codes = True
pretty = True

plugins = pydantic.mypy

[pydantic-mypy]
init_typed = True
warn_required_dynamic_aliases = True

# Optional heavy backends are imported lazily and may be absent.
[mypy-ultralytics.*]
ignore_missing_imports = True

[mypy-instructor.*]
ignore_missing_imports = True

[mypy-langfuse.*]
ignore_missing_imports = True

[mypy-anthropic.*]
ignore_missing_imports = True

[mypy-openai.*]
ignore_missing_imports = True

[mypy-cv2.*]
ignore_missing_imports = True

[mypy-tests.*]
disallow_untyped_defs = False
