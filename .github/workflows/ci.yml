name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  # Fail rather than silently resolving a fresh dependency set.
  UV_FROZEN: "1"

jobs:
  lockfile:
    name: Lockfile is current
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: uv.lock matches pyproject.toml
        run: uv lock --check

  quality:
    name: Lint & type-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install from lockfile
        run: uv sync --locked --extra dev --extra ui

      - name: Ruff lint
        run: uv run ruff check --output-format=github .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy --config-file mypy.ini

  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install from lockfile
        run: uv sync --locked --extra dev --extra ui

      - name: Sample data is deterministic
        run: |
          uv run python scripts/generate_sample_data.py --force
          git diff --exit-code -- data/sample_data \
            || { echo "::error::generate_sample_data.py is not reproducible"; exit 1; }

      - name: Run pytest
        run: |
          uv run pytest \
            --cov=smart_shelf \
            --cov-report=xml \
            --cov-report=term-missing \
            --junitxml=junit.xml \
            -q

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: |
            coverage.xml
            junit.xml
          if-no-files-found: ignore

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lockfile, quality, test]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          load: true
          tags: smart-shelf-analytics:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image
        run: |
          docker run -d --name shelf-ci -p 8000:8000 \
            -e SHELF_ENVIRONMENT=local \
            -e SHELF_DATABASE_URL='sqlite+aiosqlite:///./data/audits.db' \
            smart-shelf-analytics:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then exit 0; fi
            sleep 2
          done
          echo "::error::health check never became ready"
          docker logs shelf-ci
          exit 1
